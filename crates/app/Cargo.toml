[package]
name = "animara-app"
description = "Animara desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "animara"
path = "src/main.rs"

[dependencies]
animara-geometry.workspace = true
animara-document.workspace = true
animara-animation.workspace = true
animara-rigging.workspace = true
animara-text.workspace = true
animara-renderer.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.17"
dirs = "7.0.0"
